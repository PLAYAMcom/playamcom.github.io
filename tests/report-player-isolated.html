<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PLAYAM isolated Report Player test</title></head><body><h1>Isolated Report Player mock test</h1><p>This page uses only in-memory mock data. It does not connect to Supabase or write real reports.</p><label>Player <select id="target"><option value="">Choose player</option><option value="player-b">Player B</option></select></label><label>Reason <select id="reason"><option value="">Choose reason</option><option>Harassment</option><option>Spam</option><option>Cheating</option><option>Inappropriate content</option><option>Hate speech</option><option>Other</option></select></label><label>Details <textarea id="details" maxlength="2000"></textarea></label><button id="send">Send mock report</button><p id="status" aria-live="polite"></p><button id="tests">Run mock checks</button><pre id="results"></pre><script>const reports=[];let submitted=false;document.getElementById('send').onclick=()=>{const t=target.value,r=reason.value,d=details.value.trim();if(submitted)return status.textContent='Duplicate blocked';if(!t)return status.textContent='Choose a player';if(!r)return status.textContent='Choose a reason';if(d.length>2000)return status.textContent='Details too long';reports.push({target:t,reason:r,details:d});submitted=true;send.disabled=true;status.textContent='Mock report accepted; no backend was contacted.'};document.getElementById('tests').onclick=()=>{const checks=[];target.value='';reason.value='Other';send.disabled=false;submitted=false;send.click();checks.push('Missing player blocked: '+(reports.length===0));target.value='player-b';reason.value='';send.disabled=false;submitted=false;send.click();checks.push('Missing reason blocked: '+(reports.length===0));reason.value='Spam';send.disabled=false;submitted=false;send.click();checks.push('Mock report stored in memory: '+(reports.length===1));send.click();checks.push('Duplicate prevented: '+(reports.length===1));results.textContent=checks.join('\n')};</script></body></html>
